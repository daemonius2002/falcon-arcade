<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Falcon Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="arcade.css">
</head>
<body>
<header class="top"><div>
  <a class="logo" href="#top">
    <svg aria-hidden="true" width="36" height="36" viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M5 1h2v3h1v2h2v2h1v2H8v1H4v-1H1V8h1V6h2V4h1z" fill="#ff9a2a"/><path d="M5 4h2v3H5z" fill="#5fe3d6"/></svg>
    <span>FALCON <em>ARCADE</em></span>
  </a>
  <nav id="nav" aria-label="Categories"></nav>
  <div class="tools">
    <label class="vh" for="q">Search games</label>
    <input id="q" type="search" placeholder="Search games" autocomplete="off">
    <button id="pb" type="button" title="Change player name">Player 1</button>
  </div>
</div></header>
<main id="view"></main>
<footer id="foot"></footer>
<dialog id="dlg"><form id="nf"><label for="nm">PLAYER NAME</label><input id="nm" maxlength="14" autocomplete="off"><button class="big" type="submit">SAVE</button></form></dialog>

<script src="arcade.js"></script>
<script src="games/snake-trail.js"></script>
<script src="games/brick-breaker.js"></script>
<script src="games/maze-chase.js"></script>
<script src="games/frog-crossing.js"></script>
<script src="games/paddle-duel.js"></script>
<script src="games/block-drop.js"></script>
<script src="games/gem-match.js"></script>
<script src="games/number-slide.js"></script>
<script src="games/pipe-flow.js"></script>
<script src="games/memory-cards.js"></script>
<script>Arcade.boot();</script>
</body>
</html>
